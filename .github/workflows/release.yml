name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs: with a version (e.g. 1.0.1) the workflow tags that commit as
  # v<version> and publishes a release. With no version it only builds, signs
  # and notarizes the DMG and uploads it as a workflow artifact.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (leave empty for a build-only test run)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db" >> "$GITHUB_ENV"

      - name: Require commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases can only be built from commits on main."
            exit 1
          fi

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            PUBLISH=true
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Invalid version '$INPUT_VERSION' (expected e.g. 1.0.1)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::Tag v$VERSION already exists"
              exit 1
            fi
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (publish: $PUBLISH)"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build universal app bundle
        run: make bundle ARCHS="arm64 x86_64" VERSION="${{ steps.version.outputs.version }}"

      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict --verbose=2 .build/ScreenCaddy.app
          lipo -info .build/ScreenCaddy.app/Contents/MacOS/ScreenCaddy

      - name: Create DMG
        run: ./scripts/create-dmg.sh build

      - name: Sign DMG
        run: codesign --force --timestamp --sign "Developer ID Application" .build/ScreenCaddy.dmg

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"

          xcrun notarytool submit .build/ScreenCaddy.dmg \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH"

          xcrun stapler staple .build/ScreenCaddy.dmg
          xcrun stapler validate .build/ScreenCaddy.dmg
          spctl --assess --type open --context context:primary-signature -vv .build/ScreenCaddy.dmg

      - name: Checksum
        run: |
          cd .build
          shasum -a 256 ScreenCaddy.dmg > ScreenCaddy.dmg.sha256
          cat ScreenCaddy.dmg.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCaddy-${{ steps.version.outputs.version }}
          path: |
            app/.build/ScreenCaddy.dmg
            app/.build/ScreenCaddy.dmg.sha256

      # Creates the v<version> tag on this commit if it doesn't exist yet.
      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            .build/ScreenCaddy.dmg \
            .build/ScreenCaddy.dmg.sha256 \
            --title "ScreenCaddy $VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
