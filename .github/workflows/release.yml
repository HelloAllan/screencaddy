name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build, sign and notarize the DMG and upload it as a workflow
  # artifact, but do not publish a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases can only be built from commits on main."
            exit 1
          fi

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build universal app bundle
        run: make bundle ARCHS="arm64 x86_64" VERSION="${{ steps.version.outputs.version }}"

      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict --verbose=2 .build/ScreenCaddy.app
          lipo -info .build/ScreenCaddy.app/Contents/MacOS/ScreenCaddy

      - name: Create DMG
        run: ./scripts/create-dmg.sh build

      - name: Sign DMG
        run: codesign --force --timestamp --sign "Developer ID Application" .build/ScreenCaddy.dmg

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"

          xcrun notarytool submit .build/ScreenCaddy.dmg \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH"

          xcrun stapler staple .build/ScreenCaddy.dmg
          xcrun stapler validate .build/ScreenCaddy.dmg
          spctl --assess --type open --context context:primary-signature -vv .build/ScreenCaddy.dmg

      - name: Checksum
        run: |
          cd .build
          shasum -a 256 ScreenCaddy.dmg > ScreenCaddy.dmg.sha256
          cat ScreenCaddy.dmg.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCaddy-${{ steps.version.outputs.version }}
          path: |
            app/.build/ScreenCaddy.dmg
            app/.build/ScreenCaddy.dmg.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .build/ScreenCaddy.dmg \
            .build/ScreenCaddy.dmg.sha256 \
            --title "ScreenCaddy ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
